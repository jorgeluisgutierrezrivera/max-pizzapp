# ==========================================================
# Max Pizzapp - orquestacion de contenedores (base)
#
# Este archivo define la base comun del entorno: el nombre del
# proyecto, la red interna por la que se hablan los contenedores,
# el volumen de datos persistentes y los ajustes que comparten
# todos los servicios.
#
# Los servicios (base de datos, identidad y API) se incorporan
# sobre esta base en los siguientes incrementos.
#
# Uso (desde la raiz del repositorio, con el .env ya creado a
# partir de .env.example):
#   docker compose --env-file .env -f docker/docker-compose.yml config
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#   docker compose --env-file .env -f docker/docker-compose.yml down
# ==========================================================

name: maxpizzapp

# NOMBRES DE CONTENEDOR: por rol y con el prefijo del proyecto
#   maxpizzapp-bd | maxpizzapp-auth | maxpizzapp-backend | maxpizzapp-proxy
# Los nombres de contenedor son unicos en TODO el demonio de Docker, no por
# proyecto. En la maquina de desarrollo convive el sistema anterior, que ya
# ocupa maxpizzapp-postgres, maxpizzapp-keycloak y maxpizzapp-api: repetir
# cualquiera de esos nombres hace fallar el arranque con "name is already in
# use", y en una captura de pantalla no se distinguiria un sistema del otro.
#
# PUERTOS DEL HOST en desarrollo: el sistema anterior ocupa 5432, 3000 y 8081.
# Cuando un servicio de aqui necesite publicarse, usar 5433 (base), 3001 (API)
# y 8082 (identidad). El 8080 NO se usa: en Windows cae en un rango reservado
# por winnat y no se puede publicar (error E-001 de la base de conocimiento).
# En produccion no se publica ninguno: entra todo por el proxy en 80/443.

# Ajustes comunes que heredaran los servicios con << : *servicio-comun.
# Las credenciales llegan siempre desde .env (nunca escritas aqui).
x-servicio-comun: &servicio-comun
  restart: unless-stopped
  env_file:
    - ../.env
  networks:
    - interna

services:

  # --------------------------------------------------------
  # Base de datos: la unica fuente de verdad del sistema.
  #
  # El esquema se aplica solo al CREAR el volumen, leyendo los
  # scripts de ./postgres/init en orden alfabetico. Volver a
  # levantar no los reejecuta: para reaplicarlos en desarrollo
  # hay que recrear la base con "down -v".
  # --------------------------------------------------------
  postgres:
    <<: *servicio-comun
    image: postgres:17-alpine
    container_name: maxpizzapp-bd

    volumes:
      # Datos persistentes: sobreviven a "down" (sin -v).
      - postgres_datos:/var/lib/postgresql/data
      # Scripts de inicializacion, montados en SOLO LECTURA:
      # el contenedor los lee, nunca los modifica.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    # El puerto NO se publica al host: los contenedores se
    # alcanzan entre si por la red interna. Descomentar solo
    # para inspeccionar la base con una herramienta externa
    # (POSTGRES_PORT se define en .env).
    # ports:
    #   - "${POSTGRES_PORT}:5432"

    # Comprobacion de salud: lo que dependa de la base esperara
    # a que este realmente lista para aceptar conexiones, no
    # solo a que el contenedor exista.
    # El doble signo ($$) evita que Compose interpole la
    # variable: la resuelve el shell dentro del contenedor, asi
    # el usuario no queda escrito en "docker compose config".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------
  # Identidad: el unico lugar donde viven credenciales y roles.
  #
  # La aplicacion NO guarda usuarios ni contrasenas: redirige
  # aqui, y a cambio recibe un token firmado que el servidor
  # valida contra las claves publicas de este servicio.
  #
  # En DESARROLLO corre con "start-dev": sin exigencia de HTTPS
  # ni de hostname, que es lo que permite construir y probar el
  # realm en local. En produccion se arranca con "start" y el
  # hostname publico (ver docker-compose.prod.yml): el emisor de
  # los tokens debe ser la URL publica o la API los rechaza
  # todos.
  #
  # "--import-realm" lee ./keycloak al arrancar. El realm se
  # versiona como archivo para que el servidor sea una
  # importacion y no una configuracion a mano, repetida de
  # memoria y distinta cada vez.
  # --------------------------------------------------------
  keycloak:
    <<: *servicio-comun
    image: quay.io/keycloak/keycloak:26.7
    container_name: maxpizzapp-auth
    command: ["start-dev", "--import-realm"]

    environment:
      # Persistencia: base propia dentro del mismo PostgreSQL
      # (creada por docker/postgres/init/00_bases.sql).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Administrador inicial: solo para configurar. No es un
      # usuario del sistema ni se usa para iniciar sesion en la
      # aplicacion.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Habilita /health en el puerto de gestion (9000), que es
      # lo que consulta la comprobacion de salud de aqui abajo.
      KC_HEALTH_ENABLED: "true"

    # Sin base de datos lista, Keycloak arranca y muere. Espera a
    # que PostgreSQL responda de verdad, no solo a que exista.
    depends_on:
      postgres:
        condition: service_healthy

    ports:
      # Consola de administracion en http://localhost:8082 (ver
      # .env). El 8080 esta reservado por winnat en Windows y el
      # 8081 lo ocupa el sistema anterior en la maquina de
      # desarrollo. En produccion no se publica: entra por Caddy.
      - "${KEYCLOAK_PORT}:8080"

    volumes:
      # El realm versionado, en solo lectura: el contenedor lo
      # importa, nunca lo modifica.
      - ./keycloak:/opt/keycloak/data/import:ro

    # La imagen no trae curl ni wget: se consulta el endpoint de
    # salud abriendo el socket desde el propio shell.
    healthcheck:
      test: ["CMD-SHELL", 'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "UP"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

networks:
  # Red privada del proyecto: los contenedores se ven entre si por
  # su nombre de servicio y solo se publican al host los puertos
  # que se declaren de forma explicita.
  interna:
    driver: bridge

volumes:
  # Datos de PostgreSQL: sobreviven a "down" y a la recreacion de
  # los contenedores (la base de datos es la fuente de verdad).
  postgres_datos:
