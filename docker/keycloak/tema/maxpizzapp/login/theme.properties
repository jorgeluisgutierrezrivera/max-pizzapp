# ==========================================================
# Tema de la pagina de acceso de Max Pizzapp (tarjeta 11, D-77).
#
# Hereda del tema oficial de Keycloak 26 (keycloak.v2): las paginas,
# los textos en espanol y PatternFly 5 son los de Keycloak. Este tema
# solo suma una hoja de estilos (css/maxpizzapp.css) y tres imagenes
# (el logo, la foto de la portada y el icono de la pestana). Lo que
# falte aqui, Keycloak lo busca en el tema padre.
#
# Nada se carga de otro sitio (D-78): la fuente es la del sistema y
# las imagenes salen del propio Keycloak.
# ==========================================================
parent=keycloak.v2
import=common/keycloak

# css/styles.css es la del tema oficial; la nuestra va despues.
styles=css/styles.css css/maxpizzapp.css

# La app es de tema claro: el acceso tambien, aunque el sistema este
# en modo oscuro.
darkMode=false
