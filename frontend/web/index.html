<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Flutter reemplaza este valor con el de --base-href al compilar. La app se sirve en la
       raiz del dominio, asi que queda en "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Sin meta viewport: Flutter inserta la suya y avisa si encuentra otra. -->
  <meta name="description" content="Max Pizzapp: pedidos entre recepcion y cocina en tiempo real">
  <!-- Un sistema interno de un local no tiene por que aparecer en buscadores. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#C0392B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Max Pizzapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Max Pizzapp</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
